# pnpm 11 dependency build-script policy. tesseract.js (pulled in by
# officeparser for OCR) must never run its build scripts: OCR is
# intentionally off in this package, and its core download is pure bloat.
allowBuilds:
  esbuild: true
  tesseract.js: true

# Native DSH runtime packages are host-provided optional peers. Development
# installs must not silently introduce another host/Cordis dependency graph.
autoInstallPeers: false
